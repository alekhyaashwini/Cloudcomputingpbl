version: '3.8'

services:
  # ==============================================================================
  # MinIO Object Storage Service (S3-Compatible Local Storage)
  # ==============================================================================
  minio:
    image: minio/minio:latest
    container_name: secure_vault_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API Gateway
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER: "on"
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==============================================================================
  # MinIO Bucket Auto-Provisioning Service (minio/mc)
  # Automatically creates 'secure-vault-bucket' on container startup
  # ==============================================================================
  minio-init:
    image: minio/mc:latest
    container_name: secure_vault_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO server connection...';
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Retrying MinIO connection in 1 second...';
        sleep 1;
      done;
      echo 'MinIO alias configured successfully.';
      
      echo 'Creating target secure bucket [secure-vault-bucket] if not already present...';
      /usr/bin/mc mb --ignore-existing local/secure-vault-bucket;
      
      echo 'Configuring bucket privacy (private by default for Zero-Knowledge security)...';
      /usr/bin/mc anonymous set none local/secure-vault-bucket;
      
      echo 'Bucket verification:';
      /usr/bin/mc ls local;
      echo 'MinIO storage initialization complete!';
      exit 0;
      "

  # ==============================================================================
  # MongoDB Metadata Database Service
  # ==============================================================================
  mongodb:
    image: mongo:7.0
    container_name: secure_vault_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" # MongoDB default port
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: vaultsecret
      MONGO_INITDB_DATABASE: secure_vault
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio_data:
    name: secure_vault_minio_data
  mongo_data:
    name: secure_vault_mongo_data
