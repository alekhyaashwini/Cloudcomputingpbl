{% extends "base.html" %}

{% block title %}Sign In — Secure Cloud Vault{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card bg-secondary bg-opacity-25 border-secondary p-4 rounded-4 shadow">
            <h3 class="fw-bold text-center text-white mb-2">Vault Authentication</h3>
            <p class="text-center text-secondary small mb-4">Enter credentials to unlock your encrypted file vault</p>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="identifier" class="form-label text-light">Username or Email</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" id="identifier" name="identifier" required autofocus placeholder="e.g. cs_student or user@college.edu">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label text-light">Password</label>
                    <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In to Vault</button>
            </form>

            <div class="mt-4 text-center small text-secondary">
                Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-info text-decoration-none">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
